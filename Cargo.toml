[package]
name = "supa-dev"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Desktop manager for Qwen Code, LM Studio and the prompt-repair gateway"
publish = false
repository = "https://github.com/Supa-Doge/supa-dev"
build = "build.rs"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
