name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: supa-dev-windows-x86_64.exe
            binary: target/release/supa-dev.exe
          - os: ubuntu-22.04
            asset: supa-dev-linux-x86_64
            binary: target/release/supa-dev
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Bundle LM Studio client
        working-directory: backend/components/lmstudio-client
        run: |
          npm ci --no-audit --no-fund
          npm run bundle
      - name: Gateway and installer contracts
        run: |
          python backend/scripts/test-gateway-repair.py --synthetic-only
          python backend/scripts/test-runtime.py
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Prepare asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath '${{ matrix.binary }}' -Destination 'dist/${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified binaries
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum supa-dev-windows-x86_64.exe supa-dev-linux-x86_64 > SHA256SUMS
          gh release create "$RELEASE_TAG" supa-dev-windows-x86_64.exe supa-dev-linux-x86_64 SHA256SUMS --verify-tag --title "Supa Dev $RELEASE_TAG" --notes 'Менеджер окружения Qwen Code: настройка ключа, установка LM Studio runtime и локального редактора, qwen-work, запуск терминала и обновления приложения. Ключи вводятся пользователями и не входят в сборку. Windows x64 / Linux x64 (glibc 2.35+).'
